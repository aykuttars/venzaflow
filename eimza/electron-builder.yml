appId: com.tenancysoft.eimza
# Spaceless productName → /opt/TenancySoft-e-imza (GNOME breaks on spaced install paths).
productName: TenancySoft-e-imza
copyright: Copyright © 2026 Aykut Arslantas
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/**'
asarUnpack:
  - 'node_modules/graphene-pk11/**'
  - 'node_modules/pkcs11js/**'
extraResources:
  # Optional bundled PKCS#11 libraries (e.g. OpenSC) for zero-install support.
  # Files live in resources/pkcs11/<platform>/ and are copied to Resources/pkcs11/.
  - from: resources/pkcs11
    to: pkcs11
    filter:
      - '**/*'
win:
  executableName: TenancySoft-e-imza
  target:
    - nsis
  artifactName: tenancysoft-eimza-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: tenancysoft-eimza-${version}-setup-${arch}.${ext}
  shortcutName: TenancySoft e-imza
  uninstallDisplayName: TenancySoft e-imza
  createDesktopShortcut: always
mac:
  category: public.app-category.business
  # Ad-hoc signature ('-') so Apple Silicon shows a bypassable "unverified"
  # warning instead of the unrecoverable "app is damaged" Gatekeeper error.
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  artifactName: tenancysoft-eimza-${version}-mac-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
  notarize: false
dmg:
  artifactName: tenancysoft-eimza-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Aykut Arslantas
  vendor: Aykut Arslantas
  synopsis: TenancySoft e-imza masaüstü imza köprüsü
  description: USB e-imza tokenları ile e-reçete, e-arşiv ve e-fatura imzalama uygulaması.
  category: Office
  # executableName drives the binary name, the /usr/bin symlink and the
  # generated desktop Exec. electron-builder 26 forbids a custom desktop Exec.
  executableName: eimza
  desktop:
    entry:
      Name: TenancySoft e-imza
      StartupWMClass: TenancySoft-e-imza
appImage:
  artifactName: tenancysoft-eimza-${version}-linux-${arch}.${ext}
deb:
  artifactName: tenancysoft-eimza-${version}-linux-${arch}.${ext}
  afterInstall: scripts/linux-postinst.sh
  depends:
    - libnotify4
    - libsecret-1-0
    - pcscd
    - libpcsclite1
npmRebuild: true
publish:
  provider: generic
  url: https://example.com/eimza-updates
