appId: com.aykut.eimza
productName: eimza
copyright: Copyright © 2026 Aykut
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/**'
asarUnpack:
  - 'node_modules/graphene-pk11/**'
  - 'node_modules/pkcs11js/**'
extraResources:
  # Optional bundled PKCS#11 libraries (e.g. OpenSC) for zero-install support.
  # Files live in resources/pkcs11/<platform>/ and are copied to Resources/pkcs11/.
  - from: resources/pkcs11
    to: pkcs11
    filter:
      - '**/*'
win:
  executableName: eimza
  target:
    - nsis
  artifactName: eimza-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: eimza-${version}-setup.${ext}
  shortcutName: eimza
  uninstallDisplayName: eimza
  createDesktopShortcut: always
mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  artifactName: eimza-${version}-mac-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
  notarize: false
dmg:
  artifactName: eimza-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: Aykut
  category: Office
appImage:
  artifactName: eimza-${version}-linux-${arch}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://example.com/eimza-updates
