name: Build eimza

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: mac
            arch: arm64
            runner: macos-latest
            artifact: release/*.dmg

          - label: macOS x64
            platform: mac
            arch: x64
            runner: macos-latest
            artifact: release/*.dmg

          - label: Windows x64
            platform: win
            arch: x64
            runner: windows-latest
            artifact: |
              release/*setup*.exe
              release/*.exe

          - label: Windows arm64
            platform: win
            arch: arm64
            runner: windows-11-arm
            artifact: |
              release/*setup*.exe
              release/*.exe

          - label: Linux x64
            platform: linux
            arch: x64
            runner: ubuntu-latest
            artifact: release/*.AppImage

          - label: Linux arm64
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: release/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and bundle
        run: npm run build

      - name: Package ${{ matrix.label }}
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify pkcs11 native binary
        shell: bash
        run: bash scripts/verify-pkcs11-binary.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: List release artifacts
        shell: bash
        run: ls -lh release/ || dir release

      - uses: actions/upload-artifact@v4
        with:
          name: eimza-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
