appId: com.venzaflow.ebarcode
productName: ebarcode
copyright: Copyright © 2026 Aykut Arslantas
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/**'
win:
  executableName: ebarcode
  target:
    - nsis
  artifactName: venzaflow-ebarcode-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  menuCategory: Venzaflow
  artifactName: venzaflow-ebarcode-${version}-setup-${arch}.${ext}
  shortcutName: Venzaflow e-barcode
  uninstallDisplayName: Venzaflow e-barcode
  createDesktopShortcut: always
mac:
  category: public.app-category.business
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - pkg
  artifactName: venzaflow-ebarcode-${version}-mac-${arch}.${ext}
  extendInfo:
    CFBundleDisplayName: Venzaflow e-barcode
    CFBundleName: ebarcode
  notarize: false
dmg:
  artifactName: venzaflow-ebarcode-${version}-mac-${arch}.${ext}
  title: Venzaflow e-barcode ${version}
pkg:
  installLocation: /Applications/Venzaflow
  allowAnywhere: false
  isRelocatable: false
linux:
  target:
    - AppImage
    - deb
  maintainer: Aykut Arslantas
  vendor: Aykut Arslantas
  synopsis: Venzaflow e-barcode masaüstü barkod köprüsü
  description: XP-P328B TSPL yazıcı ve Netum barkod okuyucu için Venzaflow envanter köprüsü.
  category: Office
  executableName: ebarcode
  desktop:
    entry:
      Name: Venzaflow e-barcode
      StartupWMClass: ebarcode
appImage:
  artifactName: venzaflow-ebarcode-${version}-linux-${arch}.${ext}
deb:
  artifactName: venzaflow-ebarcode-${version}-linux-${arch}.${ext}
  afterInstall: scripts/linux-postinst.sh
  depends:
    - libnotify4
    - libsecret-1-0
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/ebarcode-updates
