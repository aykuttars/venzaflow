# Production stack — project name: tenancysoft (pull from private registry)
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d

name: tenancysoft

services:
  backend:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-api:${TAG:-latest}
    container_name: tenancysoft-api
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-worker:${TAG:-latest}
    container_name: tenancysoft-worker
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      SKIP_MIGRATE: "true"
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-web:${TAG:-latest}
    container_name: tenancysoft-web
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_static:
  backend_media:
