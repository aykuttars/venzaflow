# Production stack — project name: tenancysoft (pull from private registry)
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d

name: tenancysoft

services:
  api:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-api${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    container_name: tenancysoft-api${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  celery:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-celery${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    container_name: tenancysoft-celery${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      SKIP_MIGRATE: "true"
    entrypoint: []
    command: >
      sh -c "ENV=$${ENVIRONMENT:-prod} && ENV=$$(echo $$ENV | tr '[:upper:]' '[:lower:]') &&
      celery -A config.celery:app worker -l info --queues=$${ENV}_default,$${ENV}_billing"
    volumes:
      - backend_media:/app/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-celery-beat${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    container_name: tenancysoft-celery-beat${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      SKIP_MIGRATE: "true"
    entrypoint: []
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler=django_celery_beat.schedulers:DatabaseScheduler",
      ]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-web${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    container_name: tenancysoft-web${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  backend_static:
  backend_media:
