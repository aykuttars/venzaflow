# Production stack: pulls pre-built images from the private registry.
# Usage on the production host:
#   docker login 10.0.0.3:5000
#   cp .env.example .env  # then edit
#   docker compose -f docker/docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
#
# Env overrides:
#   REGISTRY (default 10.0.0.3:5000)
#   TAG      (default latest)

services:
  backend:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-api:${TAG:-latest}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-worker:${TAG:-latest}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-10.0.0.3:5000}/tenancysoft-web:${TAG:-latest}
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount certs here when TLS-enabled:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  backend_static:
  backend_media:
