# OCI artifact registry + Web UI (Zot, ORAS uyumlu)
#
# Sunucu:
#   /home/management/DockerFiles/artifacts-registry/
#     .env
#     config/config.json
#     docker-compose.yml
#     data/
#     auth/htpasswd          ← scripts/setup-htpasswd.sh ile oluşturulur
#
# İlk kurulum:
#   cp .env.example .env && düzenle
#   ./scripts/setup-htpasswd.sh
#   docker compose up -d
#
# Registry UI: https://artifacts.aykut.io  (REGISTRY_USER + .env şifresi)
# NPM: artifacts → 127.0.0.1:5099 (Websockets)
#
# Retention (şimdilik sadece eimza): platform başına son 1 release.
# scripts/retention-keep-releases.sh — RETENTION_MODE=per-platform KEEP_RELEASES=1
# Örnek cron (MAN): 0 3 * * * /home/management/DockerFiles/artifacts-registry/scripts/retention-keep-releases.sh >> /var/log/zot-retention.log 2>&1

version: "3.8"

services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.2
    container_name: artifacts-registry
    
    restart: unless-stopped
    command: ["serve", "/config/config.json"]
    ports:
      - "5099:5000"
    volumes:
      - /home/management/DockerFiles/artifacts-registry/data:/var/lib/registry
      - /home/management/DockerFiles/artifacts-registry/auth:/etc/zot/auth:ro
      - /home/management/DockerFiles/artifacts-registry/config:/config:ro
