# Production-oriented stack.
# Targets shared infrastructure at 10.0.0.3 for Postgres, Redis, RabbitMQ.
# The `db` and `redis` services in the `local-infra` profile are for offline dev only.
#
# Usage from repo root:
#   cp .env.example .env && edit
#   docker compose -f docker/docker-compose.yml --env-file .env up --build
#
# For offline dev with local Postgres/Redis:
#   docker compose -f docker/docker-compose.yml --env-file .env --profile local-infra up --build

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    # Default entrypoint runs migrate + uvicorn (config selected by ENVIRONMENT).
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Optional local infra (use `--profile local-infra`) ---
  db:
    image: postgres:16-alpine
    profiles: ["local-infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-business}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-business}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["local-infra"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: ["local-infra"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  backend_static:
  backend_media:
