# Application stack — project name: venzaflow
# NPM: test.aykut.in -> :8081 (web), test-api.aykut.in -> :8001 (api)
#
#   docker compose -f docker/docker-compose.yml --env-file .env up --build -d

name: venzaflow

services:
  api:
    image: venzaflow-api${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: venzaflow-api${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  celery:
    image: venzaflow-celery${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: venzaflow-celery${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      SKIP_MIGRATE: "true"
    entrypoint: []
    command: >
      sh -c "ENV=$${ENVIRONMENT:-prod} && ENV=$$(echo $$ENV | tr '[:upper:]' '[:lower:]') &&
      celery -A config.celery:app worker -l info --queues=$${ENV}_default,$${ENV}_billing"
    volumes:
      - backend_media:/app/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: venzaflow-celery-beat${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: venzaflow-celery-beat${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      SKIP_MIGRATE: "true"
    entrypoint: []
    command:
      [
        "celery",
        "-A",
        "config.celery:app",
        "beat",
        "-l",
        "info",
        "--scheduler=django_celery_beat.schedulers:DatabaseScheduler",
      ]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: venzaflow-web${ENVIRONMENT:+_${ENVIRONMENT}}:${TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: venzaflow-web${ENVIRONMENT:+_${ENVIRONMENT}}
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - api
    restart: unless-stopped

  # --- Optional local infra (`--profile local-infra`) ---
  db:
    image: postgres:16-alpine
    container_name: venzaflow-db
    profiles: ["local-infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-business}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-business}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: venzaflow-redis
    profiles: ["local-infra"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: venzaflow-rabbitmq
    profiles: ["local-infra"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  backend_static:
  backend_media:
