name: Build eimza

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
    paths:
      - 'eimza/**'
      - '.github/workflows/eimza-build.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'eimza/**'
      - '.github/workflows/eimza-build.yml'
  workflow_dispatch:

concurrency:
  group: eimza-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: eimza

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: mac
            arch: arm64
            runner: macos-latest
            artifact: eimza/release/*.dmg

          - label: macOS x64
            platform: mac
            arch: x64
            runner: macos-latest
            artifact: eimza/release/*.dmg

          - label: Windows x64
            platform: win
            arch: x64
            runner: windows-latest
            artifact: |
              eimza/release/*setup*.exe
              eimza/release/*.exe

          - label: Windows arm64
            platform: win
            arch: arm64
            runner: windows-11-arm
            artifact: |
              eimza/release/*setup*.exe
              eimza/release/*.exe

          # ubuntu-22.04: glibc 2.35 — AppImage runs on Ubuntu 22.04+ (ubuntu-latest uses glibc 2.38+)
          - label: Linux x64
            platform: linux
            arch: x64
            runner: ubuntu-22.04
            artifact: |
              eimza/release/*.AppImage
              eimza/release/*.deb

          - label: Linux arm64
            platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact: |
              eimza/release/*.AppImage
              eimza/release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eimza/package-lock.json

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 build-essential python3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply pkcs11js patch (AKİS C_Initialize NULL fix)
        run: npx patch-package

      - name: Verify pkcs11js patch
        shell: bash
        run: bash scripts/verify-pkcs11-patch.sh

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Typecheck and bundle
        run: npm run build

      - name: Package ${{ matrix.label }}
        # No CSC_IDENTITY_AUTO_DISCOVERY=false: that would skip signing entirely.
        # mac.identity '-' makes electron-builder apply an ad-hoc signature instead,
        # which avoids the "app is damaged" error on Apple Silicon.
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Verify pkcs11 native binary
        shell: bash
        run: bash scripts/verify-pkcs11-binary.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: List release artifacts
        shell: bash
        run: ls -lh release/ || dir release

      - uses: actions/upload-artifact@v4
        with:
          name: eimza-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
