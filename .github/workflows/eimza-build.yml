name: Build eimza

run-name: eimza · ${{ github.ref_name }} · ${{ github.event_name }}

# PR (opened/sync): build + test only — no registry publish.
# Merge to develop/main (or direct push): GitHub fires `push` → build + publish to artifacts.aykut.io.
# pull_request `closed` is omitted so merge does not run a second, publish-skipped workflow.
on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
    paths:
      - 'eimza/**'
      - '.github/workflows/eimza-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
    paths:
      - 'eimza/**'
      - '.github/workflows/eimza-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Registry tag prefix (e.g. 1.0.0). Empty → branch-run (develop-28).'
        required: false
        type: string

concurrency:
  group: eimza-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: artifacts.aykut.io
  REGISTRY_REPO: venzaflow/eimza
  # Registry push runs on branch/tag push and manual dispatch — not on open PR CI runs.
  SHOULD_PUBLISH: ${{ github.event_name != 'pull_request' }}

defaults:
  run:
    working-directory: eimza

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # CI minutes: only Windows x64 for now. Re-enable mac/linux rows when ready.
        include:
          - label: Windows x64
            platform: win
            arch: x64
            runner: windows-latest
            min_os_version: "10.0"
            min_os_label: "Windows 10+"

          # - label: macOS arm64
          #   platform: mac
          #   arch: arm64
          #   runner: macos-latest
          #   min_os_version: "11.0.0"
          #   min_os_label: "macOS 11 (Big Sur)+"
          #   artifact: release/*.dmg

          # - label: macOS x64
          #   platform: mac
          #   arch: x64
          #   runner: macos-latest
          #   min_os_version: "11.0.0"
          #   min_os_label: "macOS 11 (Big Sur)+"
          #   artifact: release/*.dmg

          # - label: Windows arm64
          #   platform: win
          #   arch: arm64
          #   runner: windows-11-arm
          #   min_os_version: "10.0"
          #   min_os_label: "Windows 10+"

          # - label: Linux x64
          #   platform: linux
          #   arch: x64
          #   runner: ubuntu-22.04
          #   min_os_version: "22.04"
          #   min_os_label: "Ubuntu 22.04+ (glibc 2.35+)"
          #   artifact: |
          #     release/*.AppImage
          #     release/*.deb

          # - label: Linux arm64
          #   platform: linux
          #   arch: arm64
          #   runner: ubuntu-22.04-arm
          #   min_os_version: "22.04"
          #   min_os_label: "Ubuntu 22.04+ (glibc 2.35+)"
          #   artifact: |
          #     release/*.AppImage
          #     release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eimza/package-lock.json

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 build-essential python3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply pkcs11js patch (AKİS C_Initialize NULL fix)
        run: npx patch-package

      - name: Verify pkcs11js patch
        shell: bash
        run: bash scripts/verify-pkcs11-patch.sh

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Typecheck and bundle
        run: npm run build

      - name: Package ${{ matrix.label }}
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Verify pkcs11 native binary
        shell: bash
        run: bash scripts/verify-pkcs11-binary.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: List release artifacts
        shell: bash
        run: ls -lh release/ || dir release

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            branch="${GITHUB_REF_NAME//\//-}"
            echo "value=${branch}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: env.SHOULD_PUBLISH == 'true' && matrix.runner == 'windows-11-arm'
        with:
          go-version: '1.22'

      - name: Install ORAS from source (Windows ARM64)
        if: env.SHOULD_PUBLISH == 'true' && matrix.runner == 'windows-11-arm'
        shell: bash
        run: |
          go install oras.land/oras/cmd/oras@v1.2.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - uses: oras-project/setup-oras@v1
        if: env.SHOULD_PUBLISH == 'true' && matrix.runner != 'windows-11-arm'

      - name: Install Cosign from source (Windows ARM64)
        if: env.SHOULD_PUBLISH == 'true' && matrix.runner == 'windows-11-arm'
        shell: bash
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1

      - uses: sigstore/cosign-installer@v3.7.0
        if: env.SHOULD_PUBLISH == 'true' && matrix.runner != 'windows-11-arm'

      - name: Push and sign installers on artifacts.aykut.io
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          MIN_OS_VERSION: ${{ matrix.min_os_version }}
          MIN_OS_LABEL: ${{ matrix.min_os_label }}
          ARTIFACT_GLOBS: ${{ matrix.artifact }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/push-registry-artifacts.sh

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: oras-project/setup-oras@v1

      - name: Pull installers from registry
        env:
          VERSION: ${{ github.ref_name }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p dist
          echo "$REGISTRY_PASS" | oras login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          mapfile -t tags < <(oras repo tags "${REGISTRY}/${REGISTRY_REPO}" | grep "^${VERSION}-" || true)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No registry tags found for version ${VERSION}" >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            echo ">> Pulling ${REGISTRY}/${REGISTRY_REPO}:${tag}"
            oras pull "${REGISTRY}/${REGISTRY_REPO}:${tag}" -o dist/
          done
          find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
